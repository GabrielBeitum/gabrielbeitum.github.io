<title>Páginas do app · Gabrielbeitum.ai</title>
<style>
  :root { --fundo: #f6f7f9; --cartao: #ffffff; --texto: #1c2230; --suave: #5a6375; --linha: #dde1e8; --link: #1f5fd1; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #11151c; --cartao: #19202b; --texto: #e6e9ef; --suave: #a2aab8; --linha: #2c3442; --link: #6ea2ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  article { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 28px 24px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  p, li { overflow-wrap: anywhere; }
  a { color: var(--link); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .95rem; }
  th, td { border: 1px solid var(--linha); padding: 8px 10px; text-align: left; vertical-align: top; }
  .tabela { overflow-x: auto; }
  nav { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: .95rem; }
  footer { color: var(--suave); font-size: .85rem; margin-top: 16px; text-align: center; }
  .pendente { background: #fff3cd; color: #664d03; padding: 0 4px; border-radius: 4px; }
</style>
